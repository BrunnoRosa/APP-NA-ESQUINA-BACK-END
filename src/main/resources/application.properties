spring.application.name=app_na_esquina
spring.config.import=optional:file:.env[.properties]

vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}

# Configuracao do JWT (Com fallback)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuracao do Banco de Dados MySQL (Com fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_naesquina?createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# E-mail de confirmacao de cadastro via API HTTPS (Brevo - porta 443, liberada no Railway)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:}}
brevo.sender-name=${BREVO_SENDER_NAME:Na Esquina}

# Enderecos usados no link do e-mail e na pagina de confirmacao
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.front-url=${FRONT_URL:http://localhost:8081}
# Validade do link (horas) e prazo para apagar contas nao confirmadas (horas)
app.verificacao.horas=24
app.verificacao.limpeza-horas=48
# Validade (minutos) do codigo de recuperacao de senha
app.recuperacao.minutos=15

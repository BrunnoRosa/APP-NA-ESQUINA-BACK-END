spring.application.name=app_na_esquina

# Configuração do MySQL / PostgreSQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_naesquina?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante que as tabelas sejam criadas pelo Hibernate antes de rodar o import.sql
spring.jpa.defer-datasource-initialization=true

# Força a execução dos scripts SQL na inicialização da aplicação
spring.sql.init.mode=always

# (Opcional) Impede que pequenos erros de duplicação parem o script
spring.sql.init.continue-on-error=true

